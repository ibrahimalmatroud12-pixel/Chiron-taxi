<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chiron Taxi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:#1f2937;padding:20px}.box{background:#fff;border-radius:12px;padding:25px;width:min(900px,100%);box-shadow:0 10px 30px #0003}.login .box{width:min(400px,100%)}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:7px;margin-top:5px}textarea{min-height:70px}.btn{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;color:#fff;background:#374151}.primary{background:#2563eb}.success{background:#16a34a}.danger{background:#dc2626}.layout{min-height:100vh;display:grid;grid-template-columns:230px 1fr}aside{background:#111827;color:#fff;padding:18px}aside button{display:block;width:100%;text-align:right;background:transparent;color:#d1d5db;border:0;padding:12px;border-radius:6px;cursor:pointer;margin-bottom:4px}aside button:hover,aside button.active{background:#374151;color:#fff}main{padding:20px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.actions,.grid{display:flex;gap:10px;flex-wrap:wrap}.grid>*{flex:1 1 220px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}.trip{border:1px solid #d1d5db;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap}.status{padding:10px;background:#f3f4f6;border-radius:7px;white-space:pre-wrap;margin-top:10px}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{position:static}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section id="login" class="login"><form id="loginForm" class="box"><h1>Chiron Taxi</h1><label>كلمة المرور<input id="password" type="password" required></label><br><button class="btn primary">دخول</button><div id="loginError" class="status bad hidden"></div></form></section>
<section id="app" class="layout hidden"><aside><h2>Chiron Taxi</h2><button class="nav active" data-page="dashboard">لوحة التحكم</button><button class="nav" data-page="company">بيانات الشركة</button><button class="nav" data-page="trips">الرحلات</button><button class="nav" data-page="backup">نسخ احتياطي</button></aside><main><div class="top"><div><h1 id="title">لوحة التحكم</h1><small>نظام إدارة الرحلات</small></div><div class="actions"><button id="logout" class="btn danger">خروج</button></div></div>
<section id="dashboard" class="page active"><div class="card"><h2>فحص اتصال Chiron</h2><button id="check" class="btn primary">فحص الاتصال</button><div id="health" class="status">لم يتم الفحص</div></div><div class="card"><h2>إرسال الرحلات المحددة</h2><button id="send" class="btn success">إرسال إلى Chiron</button><div id="sendStatus" class="status">لم يتم الإرسال</div><pre id="response"></pre></div></section>
<section id="company" class="page"><div class="card"><h2>بيانات الشركة</h2><div class="grid"><label>Chiron ID<input id="chironId"></label><label>KBO<input id="kbo"></label><label>بطاقة السائق<input id="driverCard"></label><label>رقم اللوحة<input id="plate"></label></div><br><button id="saveCompany" class="btn primary">حفظ</button></div></section>
<section id="trips" class="page"><div class="card"><h2>إضافة رحلة</h2><div class="grid"><label>رقم الرحلة<input id="tripId"></label><label>البداية<input id="start" type="datetime-local"></label><label>النهاية<input id="end" type="datetime-local"></label></div><br><div class="grid"><label>الانطلاق<textarea id="departure"></textarea></label><label>الوصول<textarea id="destination"></textarea></label></div><br><button id="addTrip" class="btn primary">إضافة</button><button id="clear" class="btn danger">حذف الكل</button></div><div id="tripList" class="card"><h2>الرحلات</h2></div></section>
<section id="backup" class="page"><div class="card"><button id="export" class="btn primary">تصدير نسخة</button><button id="importBtn" class="btn">استيراد نسخة</button><input id="import" type="file" accept=".json" class="hidden"></div></section></main></section>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('token');let company=JSON.parse(localStorage.getItem('company')||'{}');let trips=JSON.parse(localStorage.getItem('trips')||'[]');
function save(){localStorage.setItem('company',JSON.stringify(company));localStorage.setItem('trips',JSON.stringify(trips))}function show(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load();render()}function load(){$('chironId').value=company.chironId||'';$('kbo').value=company.kbo||'';$('driverCard').value=company.driverCard||'';$('plate').value=company.plate||''}function logout(){localStorage.removeItem('token');location.reload()}async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};let r=await fetch(url,opt),d=await r.json();if(r.status===401||r.status===403){logout();throw Error('انتهت الجلسة')}if(!r.ok)throw Error(d.bericht||'فشل الطلب');return d}function iso(v){let d=new Date(v);if(!v||isNaN(d))throw Error('الوقت غير صحيح');return d.toISOString()}
function render(){let list=$('tripList');list.innerHTML='<h2>الرحلات</h2>';if(!trips.length){list.innerHTML+='<p>لا توجد رحلات</p>';return}trips.forEach((t,i)=>{let d=document.createElement('div');d.className='trip';let c=document.createElement('input');c.type='checkbox';c.checked=t.selected!==false;c.onchange=()=>{t.selected=c.checked;save()};d.append(c,document.createTextNode(' إرسال
'+t.trip_id+'
'+t.start_time+' → '+t.end_time+'
'+t.departure+'
→ '+t.destination+'
الحالة: '+(t.status||'NOT_SENT')));list.append(d)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.bericht);token=d.token;localStorage.setItem('token',token);show()}catch(x){$('loginError').textContent=x.message;$('loginError').classList.remove('hidden')}};$('logout').onclick=logout;
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active');$('title').textContent=b.textContent});
$('saveCompany').onclick=()=>{company={chironId:$('chironId').value.trim(),kbo:$('kbo').value.trim(),driverCard:$('driverCard').value.trim(),plate:$('plate').value.trim()};save();alert('تم الحفظ')};$('addTrip').onclick=()=>{try{let t={trip_id:$('tripId').value.trim(),start_time:iso($('start').value),end_time:iso($('end').value),departure:$('departure').value.trim(),destination:$('destination').value.trim(),selected:true,status:'NOT_SENT'};if(!t.trip_id||!t.departure||!t.destination)throw Error('أكمل البيانات');trips.push(t);save();render();['tripId','start','end','departure','destination'].forEach(x=>$(x).value='')}catch(x){alert(x.message)}};$('clear').onclick=()=>{if(confirm('حذف كل الرحلات؟')){trips=[];save();render()}};
$('check').onclick=async()=>{try{$('health').textContent='جاري الفحص';let d=await api('/api/chiron/health');$('health').className='status ok';$('health').textContent='الاتصال ناجح
'+d.environment}catch(x){$('health').className='status bad';$('health').textContent=x.message}};
$('send').onclick=async()=>{try{let selected=trips.filter(t=>t.selected!==false);if(!selected.length)throw Error('حدد رحلة');let p={chiron_id:company.chironId,kbo:company.kbo,driver_card:company.driverCard,license_plate:company.plate,trips:selected.map(({trip_id,start_time,end_time,departure,destination})=>({trip_id,start_time,end_time,departure,destination}))};let d=await api('/api/chiron/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});selected.forEach(t=>t.status='SUCCESS');save();render();$('sendStatus').className='status ok';$('sendStatus').textContent='تم الإرسال
'+d.request_id;$('response').textContent=JSON.stringify(d,null,2)}catch(x){$('sendStatus').className='status bad';$('sendStatus').textContent=x.message}};
$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({company,trips},null,2)],{type:'application/json'}));a.download='chiron-backup.json';a.click()};$('importBtn').onclick=()=>$('import').click();$('import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);company=d.company||{};trips=d.trips||[];save();load();render()}catch{alert('ملف غير صالح')}};r.readAsText(e.target.files[0])};if(token)show();
</script></body></html>
